# Legacy Config-as-Code. Railway reads this only for services created before it
# deprecated railway.toml, and stops reading it on 2026-12-01. New deploys get
# these settings from the template definition instead. Kept so existing
# deployers keep their healthcheck until then.

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 240
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
